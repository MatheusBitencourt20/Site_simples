<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Loja Simples - Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Loja Simples</h1>
      <p>Controle de produtos - Curso Desenvolvimento Web</p>
    </header>

    <main>
      <section class="cartao">
        <h2>Novo produto</h2>
        <form id="form-produto">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Caderno" required />

          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 12.50" required />

          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="0" placeholder="Ex: 10" required />
          <p id="erro-quantidade" style="color: red; display: none;">A quantidade deve ser maior que zero.</p>

          <button type="submit" id="botao-form">Adicionar produto</button>
        </form>
      </section>

      <section class="cartao">
        <h2>Produtos cadastrados</h2>
        <p id="contador">Produtos cadastrados: 0</p>
        <p id="mensagem-vazio" style="display: none;">Nenhum produto cadastrado.</p>
        <ul id="lista-produtos"></ul>
      </section>
    </main>

    <script src="script.js"></script>

    <footer class="rodape">Loja Simples - Desenvolvido pelo aluno Matheus Rebelo Bitencourt</footer>
  </body>
</html>
